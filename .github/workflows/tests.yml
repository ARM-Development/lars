name: Unit Tests

on:
  push:
    branches:
      - main
      - ghactions
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2.2" "certifi>=2026.10.19"
          pip install pytest pytest-asyncio openai python-dotenv Pillow matplotlib pandas aiohttp scikit-learn pytest-mpl
          pip install -e .

      - name: Run tests
        env:
          OPENAI_API_KEY: "test-key-not-real"
          MPLBACKEND: Agg
        run: pytest tests/ -v
